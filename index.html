<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#00a2f5">
  <title>Drive Mad — Level 1</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2300a5fa'/%3E%3Cpath d='M10 27h9V16h25v11h10v21H10z' fill='%23ffd522'/%3E%3Cpath d='M25 21h13v10H25z' fill='%23394251'/%3E%3Cpath d='M11 40h14v17H11zm28 0h14v17H39z' fill='%23272b37'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
 <main id="shell" class="game-shell" aria-label="Drive Mad 第一关">
  <canvas id="game" aria-label="黄色越野车驾驶游戏" tabindex="0"></canvas>
  <div id="hud" class="hud">
   <button id="pause" class="icon-button pause" aria-label="暂停游戏" title="暂停 · Esc"><svg viewBox="0 0 44 44"><rect x="9" y="7" width="10" height="30" rx="4"/><rect x="25" y="7" width="10" height="30" rx="4"/></svg></button>
   <button id="testModeBadge" class="test-mode-badge" type="button" aria-label="退出测试模式" title="退出测试模式" hidden><span>测试模式 · 不会死亡</span><i aria-hidden="true">×</i></button>
   <div class="level-heading"><span id="levelNumber">1</span><span id="levelTitle">First Gear</span></div>
   <div class="utility">
    <button id="restart" class="icon-button" aria-label="重新开始" title="重新开始 · R"><svg viewBox="0 0 44 44"><path d="M11 17a13 13 0 1 1-1 12" fill="none" stroke-linecap="round" stroke-width="5"/><path d="M7 6v14h14z" stroke="none"/></svg></button>
    <button id="sound" class="icon-button" aria-label="打开音量调节" aria-expanded="false" title="音量调节"><svg viewBox="0 0 44 44"><path d="M5 17h8L24 8v28L13 27H5z"/><path d="M29 15q8 7 0 14m6-20q14 13 0 26" fill="none" stroke-width="3.5" stroke-linecap="round"/></svg></button>
    <div id="soundPanel" class="sound-panel" hidden>
     <label>音乐 <input id="musicVolume" type="range" min="0" max="1" step="0.01" value="0.62"></label>
     <label>音效 <input id="fxVolume" type="range" min="0" max="1" step="0.01" value="0.32"></label>
    </div>
    <button id="fullscreen" class="icon-button" aria-label="全屏" title="全屏 · F"><svg viewBox="0 0 44 44"><path d="M7 17V7h10m10 0h10v10M7 27v10h10m10 0h10V27" fill="none" stroke-width="4" stroke-linejoin="round"/></svg></button>
   </div>
   <button id="back" class="drive-button back" aria-label="按住倒车或刹车"><svg viewBox="0 0 56 80"><path d="M40 10 11 40l29 30"/></svg></button>
   <button id="gas" class="drive-button gas" aria-label="按住前进"><svg viewBox="0 0 56 80"><path d="m16 10 29 30-29 30"/></svg></button>
   <div class="gold-track" aria-hidden="true"><i id="goldFill"></i></div>
   <output id="status" class="sr-only" aria-live="polite" data-status="ready">准备开始</output>
  </div>
  <section id="mainMenu" class="main-menu" aria-label="关卡选择">
   <div class="menu-sky" aria-hidden="true"><i class="menu-cloud cloud-a"></i><i class="menu-cloud cloud-b"></i><i class="menu-mountain mountain-a"></i><i class="menu-mountain mountain-b"></i><i class="menu-road"></i><i class="menu-truck"><b></b><em></em></i></div>
   <div class="menu-topline"><span>FANCADE STYLE</span><span>第一世界 · 海岸险途</span></div>
   <div class="menu-brand"><small>PHYSICS DRIVE</small><strong>DRIVE <b>MAD</b></strong><em>一路保持平衡</em></div>
   <div class="menu-music" aria-label="背景音乐控制">
    <button id="menuMusic" class="music-disc" type="button" aria-pressed="false" aria-label="播放天气之子·幻" title="播放音乐"><span>♫</span></button>
    <div class="music-copy"><strong>天气之子·幻</strong><small>TYPE D · MENU THEME</small></div>
   </div>
   <div class="level-panel">
    <div class="level-panel-head"><span>选择关卡</span><small>1 / 6</small></div>
    <div class="level-grid">
     <button class="level-card selected" id="level1" data-level="1"><span class="level-number">01</span><span class="level-name">FIRST GEAR</span><span class="level-desc">五段跨海飞坡</span><i>▶</i></button>
     <button class="level-card" id="level2" data-level="2"><span class="level-number">02</span><span class="level-name">RAMP UP</span><span class="level-desc">连续坡道挑战</span><i>▶</i></button>
     <button class="level-card" id="level3" data-level="3"><span class="level-number">03</span><span class="level-name">OPEN SEA</span><span class="level-desc">跨海飞越小岛</span><i>▶</i></button>
     <button class="level-card" id="level4" data-level="4"><span class="level-number">04</span><span class="level-name">ASCENDING PLANKS</span><span class="level-desc">喷气助推上升木板阵</span><i>▶</i></button>
     <button class="level-card" id="level5" data-level="5"><span class="level-number">05</span><span class="level-name">JET TUNNEL</span><span class="level-desc">喷射穿墙挑战</span><i>▶</i></button>
     <button class="level-card" id="level6" data-level="6"><span class="level-number">06</span><span class="level-name">GEAR GAUNTLET</span><span class="level-desc">三连巨型齿轮阵</span><i>▶</i></button>
    </div>
    <button class="menu-start" id="menuStart"><span>开始第一关</span><b>→</b></button>
    <div class="skin-picker" aria-label="车辆皮肤">
     <div class="skin-picker-head"><span>更换皮肤</span><small id="skinLabel">经典黄</small></div>
     <div class="skin-options">
      <button type="button" id="skinYellow" class="skin-chip selected" data-car-skin="yellow" aria-label="经典黄" aria-pressed="true" style="--skin:#ffd42a"><i></i><span>黄</span></button>
      <button type="button" id="skinRed" class="skin-chip" data-car-skin="red" aria-label="烈焰红" aria-pressed="false" style="--skin:#ef4f45"><i></i><span>红</span></button>
      <button type="button" id="skinBlue" class="skin-chip" data-car-skin="blue" aria-label="海湾蓝" aria-pressed="false" style="--skin:#2e8df0"><i></i><span>蓝</span></button>
      <button type="button" id="skinGreen" class="skin-chip" data-car-skin="green" aria-label="森林绿" aria-pressed="false" style="--skin:#49c85b"><i></i><span>绿</span></button>
      <button type="button" id="skinPurple" class="skin-chip" data-car-skin="purple" aria-label="电光紫" aria-pressed="false" style="--skin:#9b63ee"><i></i><span>紫</span></button>
     </div>
    </div>
   </div>
   <div class="menu-foot"><span>ENTER 开始&nbsp; · &nbsp;← → / A D 驾驶</span><span>保持车身平衡 · 安全到达终点</span></div>
  </section>
  <section id="modal" class="modal" aria-label="游戏菜单" aria-hidden="true" hidden>
   <div class="modal-content">
    <div class="modal-emblem">★</div>
    <h1 id="modalTitle">PAUSED</h1>
    <p id="modalText">第一关 · First Gear</p>
    <button id="primary" class="play-button">继续游戏</button>
    <button id="secondary" class="text-button">重新开始</button>
    <button id="nextLevel" class="text-button next-level-button" hidden>下一关</button>
   </div>
  </section>
 </main>
 <script type="module" src="./game.mjs?v=20261002-58"></script>
</body>
</html>
